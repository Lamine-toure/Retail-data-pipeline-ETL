services:

  jenkins:
    image: jenkins/jenkins:lts-jdk17

    container_name: jenkins-etl

    restart: unless-stopped 

    user: root

    ports:
      - "8080:8080"    # Interface web Jenkins  → http://localhost:8080
      - "50000:50000"  

    volumes:
      - jenkins_home:/var/jenkins_home

      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"

      TZ: Europe/Paris

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    networks:
      - jenkins-network

volumes:
  jenkins_home:
    name: jenkins_etl_home


networks:
  jenkins-network:
    name: jenkins-etl-network
    driver: bridge